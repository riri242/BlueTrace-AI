[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetrace-ml"
version = "0.1.0"
description = "Research-grade experimental backtracking of NOAA drifter trajectories"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
marine = ["copernicusmarine>=2.0,<3", "xarray>=2024.1", "netCDF4>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
